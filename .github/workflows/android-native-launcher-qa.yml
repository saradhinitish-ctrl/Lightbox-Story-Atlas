name: Native Lightbox launcher and widgets acceptance
on:
  workflow_dispatch:
  push:
    branches: ['fix/android-native-launcher-and-webview', 'fix/functional-native-widgets-branding']
    paths:
      - 'android-widgets/**'
      - '.github/workflows/android-native-launcher-qa.yml'
permissions:
  contents: write
jobs:
  emulator-qa:
    name: Android 15 APK launcher and widget regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android API 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDK_MANAGER"
          if [ ! -f "$SDK_ROOT/platforms/android-36/android.jar" ]; then
            "$SDK_MANAGER" "platforms;android-36"
          fi
      - name: Enable KVM acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and test debug APK inside Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash android-widgets/scripts/launcher-qa.sh
      - name: Upload native studio and widget hub screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightbox-repaired-launcher-qa
          path: android-launcher-qa/
          if-no-files-found: warn
      - name: Record passing launch test and workflow run ID
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          {
            echo "Lightbox native Android launcher regression result: PASS"
            echo "Build branch: fix/android-native-launcher-and-webview"
            echo "Android emulator: API 35 (Android 15)"
            echo "App version: 1.0.1 (versionCode 2), debug build only"
            echo "Native studio: stayed open after launch"
            echo "Widget hub: opened"
            echo "Widget providers: 2x2, 4x2, 4x4 registered"
            echo "Run ID: ${GITHUB_RUN_ID}"
            echo "Artifact name: lightbox-repaired-launcher-qa"
            echo "Run URL: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Date UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Warning: signed production update and physical ColorOS verification remain separate."
          } > docs/ANDROID-LAUNCHER-QA-RESULT.txt
          git add docs/ANDROID-LAUNCHER-QA-RESULT.txt
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "Lightbox Android QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Attest repaired Android launcher emulator QA"
          git push origin HEAD:fix/android-native-launcher-and-webview
