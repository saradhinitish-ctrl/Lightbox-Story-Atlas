name: Android widgets debug build
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/unified-lightbox-android', 'fix/android-native-launcher-and-webview']
    paths:
      - 'android-widgets/**'
      - '.github/workflows/android-widgets.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK root: ${SDK_ROOT}"
          if [ ! -f "${SDK_ROOT}/platforms/android-36/android.jar" ]; then
            SDK_MANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | head -1)"
            test -n "${SDK_MANAGER}"
            yes | "${SDK_MANAGER}" --licenses >/dev/null || true
            "${SDK_MANAGER}" "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble Android widget companion
        working-directory: android-widgets
        run: gradle --no-daemon assembleDebug assembleRelease bundleRelease
      - name: Upload unsigned AAB for signing preparation
        uses: actions/upload-artifact@v4
        with:
          name: lightbox-unified-unsigned-aab
          path: android-widgets/app/build/outputs/bundle/release/app-release.aab
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lightbox-widgets-debug-apk
          path: android-widgets/app/build/outputs/apk/debug/app-debug.apk


      - name: Upload unsigned native release APK for local signing verification
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: lightbox-unified-unsigned-release-apk
          path: android-widgets/app/build/outputs/apk/release/*unsigned.apk
      - name: Upload Android SDK signing tools for isolated local verification
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p signing-qa-tools
          SIGNER="$(find "${SDK_ROOT}/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -1)"
          ALIGN="$(find "${SDK_ROOT}/build-tools" -maxdepth 2 -name 'zipalign' | sort -V | tail -1)"
          test -s "${SIGNER}"
          test -x "${ALIGN}"
          cp "${SIGNER}" signing-qa-tools/apksigner.jar
          cp "${ALIGN}" signing-qa-tools/zipalign
      - name: Upload local Android sign/verify tools
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: lightbox-android-signing-tools
          path: signing-qa-tools/
      - name: Record update build and run ID
        if: success() && github.ref == 'refs/heads/fix/android-native-launcher-and-webview'
        shell: bash
        run: |
          set -euo pipefail
          test -s android-widgets/app/build/outputs/apk/debug/app-debug.apk
          test -s android-widgets/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p docs
          {
            echo "Lightbox Android 1.0.1 unsigned update artifacts: build successful"
            echo "Workflow run ID: ${GITHUB_RUN_ID}"
            echo "Run URL: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Artifacts: lightbox-widgets-debug-apk; lightbox-unified-unsigned-release-apk; lightbox-android-signing-tools"
            echo "Commit: ${GITHUB_SHA}"
            echo "Note: this is NOT a signed installable release. Existing 1.0.0 certificate must sign it before distribution."
          } > docs/ANDROID-UPDATE-BUILD-RESULT.txt
          git add docs/ANDROID-UPDATE-BUILD-RESULT.txt
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "Lightbox Android CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Attest unsigned Android update build artifacts"
          git push origin HEAD:fix/android-native-launcher-and-webview
