name: Android widgets debug build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-widgets/**'
      - '.github/workflows/android-widgets.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK root: ${SDK_ROOT}"
          if [ ! -f "${SDK_ROOT}/platforms/android-35/android.jar" ]; then
            SDK_MANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | head -1)"
            test -n "${SDK_MANAGER}"
            yes | "${SDK_MANAGER}" --licenses >/dev/null || true
            "${SDK_MANAGER}" "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble Android widget companion
        working-directory: android-widgets
        run: gradle --no-daemon assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lightbox-widgets-debug-apk
          path: android-widgets/app/build/outputs/apk/debug/app-debug.apk

  publish:
    name: Publish install button APK
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout production website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - name: Retrieve tested Android APK
        uses: actions/download-artifact@v4
        with:
          name: lightbox-widgets-debug-apk
          path: .widget-apk-artifact
      - name: Publish APK for the Lightbox install flow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-downloads
          install -m 0644 .widget-apk-artifact/app-debug.apk android-downloads/lightbox-widgets.apk
          sha256sum android-downloads/lightbox-widgets.apk > android-downloads/SHA256SUMS
          printf 'Source commit: %s\nDebug test APK only; not a Play Store release.\n' "${{ github.sha }}" > android-downloads/BUILD.txt
          git add android-downloads/lightbox-widgets.apk android-downloads/SHA256SUMS android-downloads/BUILD.txt
          if git diff --cached --quiet; then
            echo "APK unchanged; no publish commit needed"
            exit 0
          fi
          git config user.name "Lightbox Widget Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish Lightbox widget companion test APK"
          git push origin HEAD:main
