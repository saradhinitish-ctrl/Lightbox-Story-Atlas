name: Android manuscript desk acceptance
on:
  push:
    branches: ['android/manuscript-desk-105']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build current APKs and upgrade fixture
        run: |
          manager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          "$manager" 'platforms;android-36' 'build-tools;36.0.0' 
          git worktree add --detach /tmp/lightbox-old 9b26f1689c12bf2e48834b5d8efaf8bd1e8443a6
          gradle -p /tmp/lightbox-old/android-widgets --max-workers=2 assembleDebug
          gradle -p android-widgets --max-workers=2 assembleDebug assembleRelease lintRelease
          gradle --stop
      - name: Check release key against deployed APK
        id: signer
        env:
          KEYSTORE: ${{ secrets.LIGHTBOX_ANDROID_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.LIGHTBOX_ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.LIGHTBOX_ANDROID_KEY_PASSWORD }}
          ALIAS: ${{ secrets.LIGHTBOX_ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          sdk="$ANDROID_HOME/build-tools/36.0.0"
          if [[ -z "$KEYSTORE" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" || -z "$ALIAS" ]]; then
            echo "Matching release credentials unavailable in CI" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          umask 077
          trap 'rm -f "$RUNNER_TEMP/owner.jks"' EXIT
          printf %s "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/owner.jks"
          candidate=$(keytool -exportcert -keystore "$RUNNER_TEMP/owner.jks" -alias "$ALIAS" -storepass:env STORE_PASSWORD | sha256sum | cut -d' ' -f1)
          expected=$("$sdk/apksigner" verify --print-certs android-downloads/lightbox-studio.apk | awk '/certificate SHA-256 digest:/ {print $NF;exit}')
          if [[ "$candidate" != "$expected" ]]; then
            echo "CI key differs from the deployed certificate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p candidate
          "$sdk/zipalign" -f 4 android-widgets/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$sdk/apksigner" sign --ks "$RUNNER_TEMP/owner.jks" --ks-key-alias "$ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out candidate/lightbox-studio.apk "$RUNNER_TEMP/aligned.apk"
          "$sdk/apksigner" verify --verbose --print-certs candidate/lightbox-studio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript-builds
          path: |
            android-widgets/app/build/outputs/apk/debug/*.apk
            android-widgets/app/build/outputs/apk/release/*unsigned.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash android-widgets/scripts/manuscript-qa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manuscript-emulator-evidence
          path: |
            android-launcher-qa/
            android-widget-host-qa/
      - uses: actions/upload-artifact@v4
        if: success() && hashFiles('candidate/lightbox-studio.apk') != ''
        with:
          name: owner-signed-tested
          path: candidate/lightbox-studio.apk
  welcome:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: pip install selenium==4.29.0
      - run: python3 android-widgets/scripts/welcome-qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manuscript-welcome-screens
          path: android-welcome-qa/
