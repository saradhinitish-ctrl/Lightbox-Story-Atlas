name: Native widget button host acceptance
on:
  workflow_dispatch:
  push:
    branches: ['fix/lightbox-android-104-landing-widgets']
    paths:
      - 'android-widgets/scripts/widget-host-qa.sh'
      - 'android-widgets/app/src/debug/java/com/lightbox/widgets/WidgetGalleryActivity.java'
      - 'android-widgets/app/src/main/java/com/lightbox/widgets/WidgetBaseProvider.java'
      - '.github/workflows/android-widget-host-qa.yml'
permissions:
  contents: read
concurrency:
  group: lightbox-widget-host-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-qa:
    name: Real widget host buttons (Android 13)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android compile SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          MANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$MANAGER"
          if [ ! -f "$SDK_ROOT/platforms/android-36/android.jar" ]; then
            "$MANAGER" "platforms;android-36"
          fi
      - name: Build app before starting emulator
        run: gradle -p android-widgets --no-daemon --max-workers=2 assembleDebug
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real AppWidgetHost tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 1536M
          disk-size: 3072M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash android-widgets/scripts/widget-host-qa.sh
      - name: Upload widget host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightbox-native-widget-host-evidence
          path: android-widget-host-qa/
          if-no-files-found: warn
