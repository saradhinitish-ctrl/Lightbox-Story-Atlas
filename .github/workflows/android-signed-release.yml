name: Prepare signed Lightbox Android app bundle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sign:
    name: Build signed Play upload bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -f "${SDK_ROOT}/platforms/android-36/android.jar" || "${SDK_MANAGER}" "platforms;android-36" "build-tools;36.0.0"
      - name: Require app-owner release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.LIGHTBOX_ANDROID_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.LIGHTBOX_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIGHTBOX_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LIGHTBOX_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_B64}" || { echo "Owner upload keystore missing in GitHub secrets"; exit 1; }
          test -n "${STORE_PASSWORD}" && test -n "${KEY_ALIAS}" && test -n "${KEY_PASSWORD}" || { echo "Owner upload signing credentials incomplete"; exit 1; }
          umask 077
          printf '%s' "${KEYSTORE_B64}" | base64 -d > "${RUNNER_TEMP}/lightbox-upload.jks"
          test -s "${RUNNER_TEMP}/lightbox-upload.jks"
      - name: Build signed release AAB
        env:
          LIGHTBOX_ANDROID_RELEASE_KEYSTORE: ${{ runner.temp }}/lightbox-upload.jks
          LIGHTBOX_ANDROID_STORE_PASSWORD: ${{ secrets.LIGHTBOX_ANDROID_STORE_PASSWORD }}
          LIGHTBOX_ANDROID_KEY_ALIAS: ${{ secrets.LIGHTBOX_ANDROID_KEY_ALIAS }}
          LIGHTBOX_ANDROID_KEY_PASSWORD: ${{ secrets.LIGHTBOX_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android-widgets --no-daemon bundleRelease
          cd android-widgets/app/build/outputs/bundle/release
          sha256sum app-release.aab > SHA256SUMS
      - name: Upload Play bundle for account-owner review
        uses: actions/upload-artifact@v4
        with:
          name: lightbox-android-signed-play-bundle
          path: |
            android-widgets/app/build/outputs/bundle/release/app-release.aab
            android-widgets/app/build/outputs/bundle/release/SHA256SUMS
          retention-days: 7
      - name: Remove upload keystore
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/lightbox-upload.jks"
