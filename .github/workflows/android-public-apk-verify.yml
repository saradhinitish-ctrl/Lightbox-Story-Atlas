name: Verify public Lightbox Android installer
# Revalidated after publication of signed native Lightbox 1.0.2 with functional RemoteViews.
on:
  push:
    branches: [main]
    paths:
      - "android-downloads/lightbox-studio.apk"
      - ".github/workflows/android-public-apk-verify.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify release checksum, signing identity and installed app ID
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check public signed app checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s android-downloads/lightbox-studio.apk
          sha256sum -c android-downloads/UNIFIED-SHA256SUMS
          test "$(stat -c%s android-downloads/lightbox-studio.apk)" -gt 30000
      - name: Ensure Android 36 signing utility is available
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | head -1)"
          if [ ! -f "${SDK_ROOT}/build-tools/36.0.0/apksigner" ]; then "${SDK_MANAGER}" "build-tools;36.0.0"; fi
      - name: Verify v2 signature and exact native app signing certificate
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APK="android-downloads/lightbox-studio.apk"
          "${SDK_ROOT}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > signed-apk-report.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' signed-apk-report.txt
          grep -qi 'ea2cb663c80973a290a03f7bf20e7260eb22bddc33830ea5fa6fa95526ba02df' signed-apk-report.txt
      - name: Verify Digital Asset Links match the native signed app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          data=json.load(open(".well-known/assetlinks.json"))
          wanted="EA:2C:B6:63:C8:09:73:A2:90:A0:3F:7B:F2:0E:72:60:EB:22:BD:DC:33:83:0E:A5:FA:6F:A9:55:26:BA:02:DF"
          found=any(x.get("target",{}).get("package_name")=="com.saradhinitish.lightboxstudio" and wanted in x.get("target",{}).get("sha256_cert_fingerprints",[]) for x in data)
          if not found: raise SystemExit("The Android cert and Digital Asset Links do not match")
          print("Verified domain association for Lightbox Studio Android")
          PY
      - name: Report successful public release verification
        if: success()
        shell: bash
        run: |
          {
            echo "## Lightbox 1.0.2 public APK verification"
            echo "✅ SHA-256 checksum matched."
            echo "✅ Android APK v2 signature verified."
            echo "✅ Signing certificate and Digital Asset Links match."
            echo "APK SHA-256: $(sha256sum android-downloads/lightbox-studio.apk | awk '{print $1}')"
          } >> "${GITHUB_STEP_SUMMARY}"
