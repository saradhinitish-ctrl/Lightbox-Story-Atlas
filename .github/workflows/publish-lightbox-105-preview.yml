name: Build, install-test and publish side-by-side Lightbox Preview
on:
  push:
    paths:
      - '.github/workflows/publish-lightbox-105-preview.yml'
      - 'android-widgets/scripts/preview-install-qa.sh'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout tested 1.0.5 preview source
        uses: actions/checkout@v4
        with:
          ref: 4e448a4cef02164713f8014eef7771a9ff91f914
          path: source
          persist-credentials: false
      - name: Checkout main for publication after QA
        uses: actions/checkout@v4
        with:
          ref: main
          path: publish
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build separately installable APK
        shell: bash
        run: |
          set -euo pipefail
          manager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          "$manager" 'platforms;android-36' 'build-tools;36.0.0'
          gradle -p source/android-widgets --max-workers=2 assemblePreview
          file=source/android-widgets/app/build/outputs/apk/preview/app-preview.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$file"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$file" | grep "package: name='com.saradhinitish.lightboxstudio.preview'"
          sha256sum "$file"
      - name: Enable emulator acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify fresh installation and app launch on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6144M
          heap-size: 512M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash publish/android-widgets/scripts/preview-install-qa.sh
      - name: Preserve independently installable preview build
        uses: actions/upload-artifact@v4
        with:
          name: lightbox-105-side-by-side-preview
          path: source/android-widgets/app/build/outputs/apk/preview/app-preview.apk
      - name: Publish only tested preview APK, keep stable installer unchanged
        shell: bash
        run: |
          set -euo pipefail
          install -m 644 source/android-widgets/app/build/outputs/apk/preview/app-preview.apk publish/android-downloads/lightbox-studio-1.0.5-preview.apk
          cd publish
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-downloads/lightbox-studio-1.0.5-preview.apk
          git commit -m 'Publish install-tested standalone Lightbox 1.0.5 preview APK'
          git push origin HEAD:main
