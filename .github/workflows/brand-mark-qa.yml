name: Brand Mark Website Icon QA
on:
  push:
    branches:
      - main
    paths:
      - 'favicon.svg'
      - 'favicon.ico'
      - 'apple-touch-icon.png'
      - 'app-icons/chosen-frame-*.png'
      - 'manifest.webmanifest'
      - '*.html'
      - 'tests/brand-mark-qa.mjs'
      - '.github/workflows/brand-mark-qa.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-brand-mark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify website favicons and installation icons
        run: node tests/brand-mark-qa.mjs
