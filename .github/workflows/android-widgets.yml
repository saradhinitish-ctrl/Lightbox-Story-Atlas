name: Android widgets debug build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-widgets/**'
      - '.github/workflows/android-widgets.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble Android widget companion
        working-directory: android-widgets
        run: gradle --no-daemon assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lightbox-widgets-debug-apk
          path: android-widgets/app/build/outputs/apk/debug/app-debug.apk
