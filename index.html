"font-size:1.3rem;margin-top:24px">Software Modules</h2><ul><li><strong>Story Atlas Module:</strong> Live timeline plotting and complex story mapping engine.</li><li><strong>Screenplay Editor:</strong> Production-grade scriptwriting canvas with custom pacing meters.</li><li><strong>Visual Worldbuilder:</strong> Interactive database for scene beats, aesthetic motifs, and character architectures.</li></ul><p style="margin-top:32px;font-size:0.9rem;color:#777">Please enable JavaScript in your browser to launch the application interface.</p></div></noscript><script defer src="./script.js"></script></body></html>
