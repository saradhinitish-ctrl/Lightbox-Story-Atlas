name: Lit Spine Website Icon QA
on:
  push:
    branches:
      - main
    paths:
      - 'favicon.svg'
      - 'favicon.ico'
      - 'apple-touch-icon.png'
      - 'app-icons/lit-spine-*.png'
      - 'manifest.webmanifest'
      - '*.html'
      - 'tests/lit-spine-qa.mjs'
      - '.github/workflows/lit-spine-icons-qa.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-lit-spine-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify website favicons and installation icons
        run: node tests/lit-spine-qa.mjs
