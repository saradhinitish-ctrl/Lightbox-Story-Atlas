name: Test public Lightbox Android APK on Pixel emulator
# Revalidated after publication of signed native Lightbox 1.0.4 with functional RemoteViews.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-public-apk-smoke.yml'
      - 'android-widgets/scripts/public-apk-smoke.sh'
      - 'android-downloads/lightbox-studio.apk'
permissions:
  contents: read
jobs:
  emulator:
    name: Install signed APK, verify native widgets and launcher
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and smoke-test the published signed APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash android-widgets/scripts/public-apk-smoke.sh
      - name: Upload install evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightbox-public-signed-apk-pixel-qa
          path: android-public-qa/
          if-no-files-found: warn
      - name: Report successful published APK emulator test
        if: success()
        shell: bash
        run: |
          {
            echo "## Public Lightbox 1.0.4 APK emulator test"
            echo "✅ Signed APK installed on Android 15."
            echo "✅ Native Studio and Widget Hub activities launched."
            echo "✅ All three widget providers registered."
            echo "See artifact lightbox-public-signed-apk-pixel-qa for screenshots."
          } >> "${GITHUB_STEP_SUMMARY}"
