name: Native widget visual QA
on:
  workflow_dispatch:
  push:
    branches: ['feature/unified-lightbox-android']
    paths:
      - 'android-widgets/**'
      - '.github/workflows/android-widget-visual-qa.yml'
permissions:
  contents: read
jobs:
  emulator-qa:
    name: Pixel emulator screenshots and widget registration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android API 36 compilation platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "${SDK_MANAGER}"
          if [ ! -f "${SDK_ROOT}/platforms/android-36/android.jar" ]; then
            "${SDK_MANAGER}" "platforms;android-36"
          fi
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run emulator visual QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash android-widgets/scripts/visual-qa.sh
      - name: Upload real Android screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightbox-android-widget-qa
          path: widget-screenshots/
          if-no-files-found: warn
