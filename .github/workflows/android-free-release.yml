name: Publish free unified Android download
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-free-release.yml'
permissions:
  contents: read
jobs:
  signed-release:
    name: Sign stable APK and verify Android signatures
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Ensure Android SDK and signing tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | head -1)"
          if [ ! -f "${SDK_ROOT}/platforms/android-36/android.jar" ]; then
             "${SDK_MANAGER}" "platforms;android-36"
          fi
          if [ ! -f "${SDK_ROOT}/build-tools/36.0.0/apksigner" ]; then
             "${SDK_MANAGER}" "build-tools;36.0.0"
          fi
      - name: Load persistent owner-managed signing key
        env:
          KEYSTORE_B64: ${{ secrets.LIGHTBOX_ANDROID_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.LIGHTBOX_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIGHTBOX_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LIGHTBOX_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64}" ] || [ -z "${STORE_PASSWORD}" ] || [ -z "${KEY_ALIAS}" ] || [ -z "${KEY_PASSWORD}" ]; then
            echo "::error::Missing persistent Android signing credentials. The account owner must save all four GitHub Actions secrets before running this workflow."
            exit 1
          fi
          umask 077
          printf '%s' "${KEYSTORE_B64}" | base64 -d > "${RUNNER_TEMP}/lightbox-release.jks"
          test -s "${RUNNER_TEMP}/lightbox-release.jks"
      - name: Build signed, installable Android app
        env:
          LIGHTBOX_ANDROID_RELEASE_KEYSTORE: ${{ runner.temp }}/lightbox-release.jks
          LIGHTBOX_ANDROID_STORE_PASSWORD: ${{ secrets.LIGHTBOX_ANDROID_STORE_PASSWORD }}
          LIGHTBOX_ANDROID_KEY_ALIAS: ${{ secrets.LIGHTBOX_ANDROID_KEY_ALIAS }}
          LIGHTBOX_ANDROID_KEY_PASSWORD: ${{ secrets.LIGHTBOX_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android-widgets --no-daemon assembleRelease
          APK="android-widgets/app/build/outputs/apk/release/app-release.apk"
          test -s "${APK}"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "${SDK_ROOT}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "${APK}" | tee "${RUNNER_TEMP}/apk-verification.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "${RUNNER_TEMP}/apk-verification.txt"
          grep -qi 'ea2cb663c80973a290a03f7bf20e7260eb22bddc33830ea5fa6fa95526ba02df' "${RUNNER_TEMP}/apk-verification.txt" || { echo 'Incompatible release signing certificate'; exit 1; }
      - name: Prepare website download and verified Android domain association
        env:
          LIGHTBOX_ANDROID_RELEASE_KEYSTORE: ${{ runner.temp }}/lightbox-release.jks
          LIGHTBOX_ANDROID_STORE_PASSWORD: ${{ secrets.LIGHTBOX_ANDROID_STORE_PASSWORD }}
          LIGHTBOX_ANDROID_KEY_ALIAS: ${{ secrets.LIGHTBOX_ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-package
          install -m 0644 android-widgets/app/build/outputs/apk/release/app-release.apk release-package/lightbox-studio.apk
          keytool -list -v -keystore "${LIGHTBOX_ANDROID_RELEASE_KEYSTORE}" -storepass "${LIGHTBOX_ANDROID_STORE_PASSWORD}" -alias "${LIGHTBOX_ANDROID_KEY_ALIAS}" > "${RUNNER_TEMP}/cert.txt"
          FINGERPRINT="$(grep -m1 'SHA256:' "${RUNNER_TEMP}/cert.txt" | sed 's/.*SHA256: *//')"
          test -n "${FINGERPRINT}"
          FINGERPRINT="${FINGERPRINT}" python3 - <<'PY'
          import json,os,pathlib
          data=[{"relation":["delegate_permission/common.handle_all_urls"],"target":{
            "namespace":"android_app","package_name":"com.saradhinitish.lightboxstudio",
            "sha256_cert_fingerprints":[os.environ["FINGERPRINT"]]}}]
          pathlib.Path("release-package/assetlinks.json").write_text(json.dumps(data,indent=2)+"\n")
          PY
          sha256sum release-package/lightbox-studio.apk | sed 's@release-package/lightbox-studio.apk@android-downloads/lightbox-studio.apk@' > release-package/SHA256SUMS
          test -s release-package/assetlinks.json
      - name: Upload testable release assets
        uses: actions/upload-artifact@v4
        with:
          name: lightbox-unified-signed-release
          path: release-package/
          retention-days: 30
      - name: Delete key from runner
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/lightbox-release.jks" "${RUNNER_TEMP}/cert.txt"
  publish:
    name: Publish signed APK only from reviewed main branch
    if: github.ref == 'refs/heads/main'
    needs: signed-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: lightbox-unified-signed-release
          path: release-package/
      - name: Publish free Android download and asset links
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-downloads .well-known
          install -m 0644 release-package/lightbox-studio.apk android-downloads/lightbox-studio.apk
          install -m 0644 release-package/assetlinks.json .well-known/assetlinks.json
          install -m 0644 release-package/SHA256SUMS android-downloads/UNIFIED-SHA256SUMS
          sha256sum -c android-downloads/UNIFIED-SHA256SUMS
          git add android-downloads/lightbox-studio.apk android-downloads/UNIFIED-SHA256SUMS .well-known/assetlinks.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "Lightbox Android Release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish verified free Lightbox Studio Android release"
          git push origin HEAD:main
