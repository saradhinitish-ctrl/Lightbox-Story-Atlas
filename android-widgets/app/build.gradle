plugins { id 'com.android.application' }

// Upload-signing material belongs to the adult-owned release account's secret store.
// No secret is placed in source control or in a debug build.
def releaseStorePath = System.getenv('LIGHTBOX_ANDROID_RELEASE_KEYSTORE')
android {
    namespace 'com.lightbox.widgets'
    compileSdk 36

    defaultConfig {
        applicationId 'com.saradhinitish.lightboxstudio'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '1.0.5'
    }
    signingConfigs {
        upload {
            if (releaseStorePath) {
                storeFile file(releaseStorePath)
                storePassword System.getenv('LIGHTBOX_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('LIGHTBOX_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('LIGHTBOX_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseStorePath) signingConfig signingConfigs.upload
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    // Native Android WebView and home-screen widget APIs require no external libraries.
}

// Package the same read-only snapshot logic used by the public sync page.
def syncAssets = tasks.register('prepareSyncAssets', Copy) {
    from rootProject.file('../story-sync.js')
    into layout.buildDirectory.dir('generated/syncAssets/studio')
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/syncAssets'))
tasks.named('preBuild').configure { dependsOn syncAssets }
