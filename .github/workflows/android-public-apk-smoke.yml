name: Test public Lightbox Android APK on Pixel emulator
# Revalidated after publication of signed native Lightbox 1.0.2 with functional RemoteViews.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-public-apk-smoke.yml'
      - 'android-widgets/scripts/public-apk-smoke.sh'
      - 'android-downloads/lightbox-studio.apk'
permissions:
  contents: write
jobs:
  emulator:
    name: Install signed APK, verify native widgets and launcher
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and smoke-test the published signed APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash android-widgets/scripts/public-apk-smoke.sh
      - name: Upload install evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightbox-public-signed-apk-pixel-qa
          path: android-public-qa/
          if-no-files-found: warn
      - name: Record successful public APK emulator verification
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK_SHA="$(sha256sum android-downloads/lightbox-studio.apk | awk '{print $1}')"
          {
            echo "Lightbox Studio Android signed public APK / Pixel emulator smoke test"
            echo "Verified APK SHA-256: $APK_SHA"
            echo "Android version: $(cat android-public-qa/android-version.txt)"
            echo "Package: com.saradhinitish.lightboxstudio"
            echo "Installation: adb install succeeded"
            echo "Widget providers: QuickProvider, WideProvider, LargeProvider present"
            echo "Native widget hub: activity launched and process remained running"
            echo "Studio launcher: activity start command succeeded"
            echo "Screenshots: GitHub Actions artifact lightbox-public-signed-apk-pixel-qa"
            echo "Verified UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Limits: Home screen placement, real ColorOS/Samsung device behavior still need manual QA."
          } > android-downloads/VERIFIED-PIXEL-QA.txt
          git add android-downloads/VERIFIED-PIXEL-QA.txt
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "Lightbox Android Emulator QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Attest Pixel emulator installation of published Lightbox APK"
          git pull --rebase origin main
          git push origin HEAD:main
