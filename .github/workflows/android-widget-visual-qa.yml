name: Native widget visual QA
on:
  workflow_dispatch:
  push:
    branches: ['feature/unified-lightbox-android']
    paths:
      - 'android-widgets/**'
      - '.github/workflows/android-widget-visual-qa.yml'
permissions:
  contents: read
jobs:
  emulator-qa:
    name: Pixel emulator screenshots and widget registration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run emulator visual QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            mkdir -p widget-screenshots
            cd android-widgets
            gradle --no-daemon assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.saradhinitish.lightbox
            adb shell dumpsys package com.saradhinitish.lightbox > ../widget-screenshots/package-dump.txt
            grep -q 'QuickProvider' ../widget-screenshots/package-dump.txt
            grep -q 'WideProvider' ../widget-screenshots/package-dump.txt
            grep -q 'LargeProvider' ../widget-screenshots/package-dump.txt
            for v in 0 1 2; do
              adb shell am force-stop com.saradhinitish.lightbox
              adb shell am start -n com.saradhinitish.lightbox/com.lightbox.widgets.WidgetGalleryActivity --ei variant "$v"
              sleep 3
              adb exec-out screencap -p > "../widget-screenshots/native-widget-${v}.png"
            done
            adb shell am force-stop com.saradhinitish.lightbox
            adb shell am start -n com.saradhinitish.lightbox/com.lightbox.widgets.WidgetHubActivity
            sleep 3
            adb exec-out screencap -p > ../widget-screenshots/widget-manager.png
      - name: Upload real Android screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightbox-android-widget-qa
          path: widget-screenshots/
          if-no-files-found: warn
