name: Generate Focus Cinematic Website Icons

on:
  push:
    branches:
      - feat/focus-cinematic-site-icon
    paths:
      - favicon.svg
      - tools/render_focus_icons.py
      - .github/workflows/focus-cinematic-icons.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image rendering dependencies
        run: python -m pip install --quiet pillow cairosvg
      - name: Render Focus Cinematic PNG and ICO sizes
        run: python tools/render_focus_icons.py
      - name: Verify generated icons
        run: |
          python - <<'PY'
          from PIL import Image
          for name, size in [
              ('app-icons/focus-cinematic-48.png',48),
              ('app-icons/focus-cinematic-180.png',180),
              ('app-icons/focus-cinematic-192.png',192),
              ('app-icons/focus-cinematic-512.png',512),
              ('app-icons/focus-cinematic-maskable-512.png',512),
              ('apple-touch-icon.png',180),
          ]:
              with Image.open(name) as icon:
                  assert icon.size == (size,size), (name,icon.size)
          with Image.open('favicon.ico') as icon:
              assert icon.size[0] >= 48, icon.size
          PY
      - name: Commit generated binary assets to feature branch
        run: |
          git config user.name "lightbox-build-bot"
          git config user.email "lightbox-build-bot@users.noreply.github.com"
          git add favicon.ico apple-touch-icon.png app-icons/focus-cinematic-*.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate approved Focus Cinematic favicon and install icons"
            git push origin HEAD:feat/focus-cinematic-site-icon
          fi
